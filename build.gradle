buildscript {
  repositories {
    mavenLocal()
    gradlePluginPortal()
    mavenCentral()
    maven {
      url = uri("https://maven.pkg.github.com/Forsakringskassan/repository")
      credentials {
        username = project.findProperty("GITHUB_ACTOR") ?: System.getenv("PACKAGES_RW_ACTOR")
        password = project.findProperty("GITHUB_TOKEN") ?: System.getenv("PACKAGES_RW_TOKEN")
      }
    }
  }

  dependencies {
    classpath "se.fk.gradle:gradle-conventions:1.18.3"
  }
}

apply plugin: "se.fk.gradle.bundle-asyncapi"

javaExtension {
  javaVersion = 21
}

dependencies {
  testImplementation platform("org.junit:junit-bom:5.14.4")
  testImplementation "org.junit.jupiter:junit-jupiter"
}

// Where se.fk.gradle.bundle-asyncapi writes the generated models (the plugin doesn't expose it).
// Relative to the project directory.
def generatedSourceDir = "src/generated-source/java"

// Make generated models java.io.Serializable (Kogito JDBC persistence without proto marshaller
// stores process variables with Java serialization). Modelina has no preset for this.
// Map fields become HashMap, since Kogito's serialization fails on fields declared as Map.
tasks.named("generateJarApi") {
  doLast {
    fileTree(generatedSourceDir) { include "**/*.java" }.each { f ->
      f.text = f.text
          .replaceFirst(
              /(?m)^public class (\w+) implements ([\w, ]+) \{$/,
              'public class $1 implements $2, java.io.Serializable {\n  private static final long serialVersionUID = 1L;\n')
          .replaceFirst(
              /(?m)^public class (\w+) \{$/,
              'public class $1 implements java.io.Serializable {\n  private static final long serialVersionUID = 1L;\n')
          .replaceAll(/\bMap</, 'java.util.HashMap<')
    }
  }
}


// Lets GeneratedModelSerializableTest find every generated model. Relative to the project
// directory (the test working directory), so the build cache stays relocatable.
tasks.named("test") {
  systemProperty "asyncapi.generated.source.dir", generatedSourceDir
}
